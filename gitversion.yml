# GitVersion Configuration
# Estrategia: versión semántica con números de commits
# Ejemplo: v1.3.2 (main) -> 1.3.3-rc.1+5 (develop)

assembly-versioning-scheme: MajorMinorPatchTag
assembly-file-versioning-scheme: MajorMinorPatchTag

mode: ContinuousDeployment
increment: Patch

# Tags Git que cumplen con semantic versioning
tag-prefix: '[vV]?'

# Configurar ramas
branches:
  master:
    regex: ^(master|main)$
    mode: Mainline
    increment: Patch
    is-mainline: true

  develop:
    regex: ^develop$
    mode: ContinuousDeployment
    increment: Minor
    label: alpha
    source-branches:
      - master

# Ignorar branches de merge
ignore:
  sha: []