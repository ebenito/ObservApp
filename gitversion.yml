# GitVersion Configuration
# Estrategia: versión semántica con números de commits
# Ejemplo: v1.3.2 (master) -> 1.3.3-alpha.1+5 (develop)
assembly-versioning-scheme: MajorMinorPatchTag
assembly-file-versioning-scheme: MajorMinorPatchTag
mode: ContinuousDeployment
increment: Patch
tag-prefix: 'v'

branches:
  main:
    regex: ^(master|main)$
    mode: ContinuousDelivery
    increment: Patch
    is-main-branch: true

  develop:
    regex: ^develop$
    mode: ContinuousDeployment
    increment: Minor
    label: alpha
    is-main-branch: false
    source-branches: [ main ]

ignore:
  sha: []