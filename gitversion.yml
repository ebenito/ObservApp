# GitVersion Configuration
# Estrategia: versión semántica con números de commits
# Ejemplo: v1.3.2 (master) -> 1.3.3-alpha.1+5 (develop)

assembly-versioning-scheme: MajorMinorPatchTag
assembly-file-versioning-scheme: MajorMinorPatchTag
mode: ContinuousDeployment
increment: Patch
tag-prefix: v

branches:
  master:
    regex: ^(master|main)$
    mode: Mainline
    increment: Patch
    is-mainline: true

  develop:
    regex: ^develop$
    mode: ContinuousDeployment
    increment: Minor
    label: alpha
    source-branches:
      - master

ignore:
  sha: []