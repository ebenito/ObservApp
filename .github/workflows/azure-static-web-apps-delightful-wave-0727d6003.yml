name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - master

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        shell: bash
        run: |
          set -euo pipefail
          echo "Fetching all tags from origin..."
          git fetch --tags || true
          echo "Tags available:"
          git tag -l || true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion, jq and update PATH
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Installing GitVersion..."
          dotnet tool install --global GitVersion.Tool --version 6.3.0
          
          echo "Installing jq..."
          sudo apt-get update && sudo apt-get install -y jq
          
          echo "Adding dotnet tools to PATH..."
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Calculate version with GitVersion
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail

          # Ensure the tool is in PATH for this step
          export PATH="$HOME/.dotnet/tools:$PATH"

          echo "Running GitVersion..."
          echo "Git diagnostics:"
          git --version
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Available tags:"
          git tag -l || true
          echo "Recent commits:"
          git log --oneline -n 10 || true

          # Run GitVersion
          dotnet-gitversion /output json /nofetch > gitversion.json || {
            echo "GitVersion failed; showing available tags and recent history"
            git tag -l || true
            git log --oneline -n 10 || true
            exit 1
          }

          echo "Parsing version info..."
          VERSION="$(jq -r '.SemVer' gitversion.json)"
          FULL_VERSION="$(jq -r '.FullSemVer' gitversion.json)"
          INFORMATIONAL_VERSION="$(jq -r '.InformationalVersion' gitversion.json)"

          echo "Writing to GITHUB_ENV..."
          {
            echo "GITVERSION_SEMVER=$VERSION"
            echo "GITVERSION_FULLSEMVER=$FULL_VERSION"
            echo "GITVERSION_INFORMATIONALVERSION=$INFORMATIONAL_VERSION"
          } >> "$GITHUB_ENV"

          echo "Version calculated: $FULL_VERSION"

      - name: Crear appsettings.Local.json para Web Client
        run: |
          mkdir -p ObservApp.Web.Client/wwwroot
          echo '{"SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}"}' \
            > ObservApp.Web.Client/wwwroot/appsettings.Local.json

      - name: Restore Web Client
        run: dotnet restore ObservApp.Web.Client/ObservApp.Web.Client.csproj -p:TargetFramework=net10.0

      - name: Publish Blazor WASM standalone
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish ObservApp.Web.Client/ObservApp.Web.Client.csproj \
            --configuration Release \
            --output ./publish/web \
            --no-restore \
            -p:TargetFramework=net10.0 \
            -p:DefineConstants=STANDALONE_WASM \
            -p:DebuggerSupport=false \
            -p:CopyOutputSymbolsToPublishDirectory=false \
            -p:Version="$GITVERSION_FULLSEMVER" \
            -p:InformationalVersion="$GITVERSION_INFORMATIONALVERSION"

      - name: Deploy to Azure Static Web Apps
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN != ''
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/web"
          output_location: ""
          skip_app_build: true