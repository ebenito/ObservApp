name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - master

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all tags
        shell: bash
        run: |
          set -euo pipefail
          echo "Fetching all tags from origin..."
          git fetch --tags || true
          echo "Tags available:"
          git tag -l || true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion, jq and update PATH
        shell: bash
        run: |
          set -euo pipefail
          
          echo "Installing GitVersion..."
          dotnet tool install --global GitVersion.Tool --version 6.3.0
          
          echo "Installing jq..."
          sudo apt-get update && sudo apt-get install -y jq
          
          echo "Adding dotnet tools to PATH..."
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Calculate version with GitVersion
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail

          # Ensure the tool is in PATH for this step
          export PATH="$HOME/.dotnet/tools:$PATH"

          echo "Running GitVersion..."
          echo "Git diagnostics:"
          git --version
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Available tags:"
          git tag -l || true
          echo "Recent commits:"
          git log --oneline -n 10 || true

          # The repository history is already complete from checkout (fetch-depth: 0),
          # so we intentionally avoid `git fetch --unshallow` here.
          # Run GitVersion and fallback to a safe version if it fails
          set +e
          dotnet-gitversion /output json /nofetch /diag gitversion.log > gitversion.json 2>&1
          GV_EXIT=$?
          set -e

          if [ $GV_EXIT -ne 0 ]; then
            echo "GitVersion failed with exit code $GV_EXIT; using fallback version"
            echo "GitVersion diagnostics (first 200 lines):"
            [ -f gitversion.log ] && sed -n '1,200p' gitversion.log || echo "(no gitversion.log generated)"
            echo "Available tags:"
            git tag -l || true
            echo "Recent commits:"
            git log --oneline -n 10 || true
            echo "Git status:"
            git status --porcelain || true

            SHA_SHORT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
            VERSION="0.0.0"
            FULL_VERSION="0.0.0+$SHA_SHORT"
            INFORMATIONAL_VERSION="0.0.0+$SHA_SHORT"
            MAJOR="0"
            MINOR="0"
          else
            echo "Parsing version info..."
            VERSION="$(jq -r '.SemVer' gitversion.json)"
            FULL_VERSION="$(jq -r '.FullSemVer' gitversion.json)"
            INFORMATIONAL_VERSION="$(jq -r '.InformationalVersion' gitversion.json)"
            MAJOR="$(jq -r '.Major' gitversion.json)"
            MINOR="$(jq -r '.Minor' gitversion.json)"
          fi

          echo "Writing to GITHUB_ENV..."
          {
            echo "GITVERSION_SEMVER=$VERSION"
            echo "GITVERSION_FULLSEMVER=$FULL_VERSION"
            echo "GITVERSION_INFORMATIONALVERSION=$INFORMATIONAL_VERSION"
            echo "GITVERSION_MAJOR=$MAJOR"
            echo "GITVERSION_MINOR=$MINOR"
          } >> "$GITHUB_ENV"

          echo "Version calculated: $FULL_VERSION"

      - name: Subir salida de GitVersion
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gitversion-debug
          path: |
            gitversion.json
            gitversion.err
          if-no-files-found: warn

      # En modo STANDALONE_WASM no hay servidor que sirva /api/client-config: la
      # configuración de Supabase tiene que ir en el appsettings.Local.json publicado.
      # La anon key de Supabase es pública por diseño (la protege RLS en la BD).
      - name: Crear appsettings.Local.json para Web Client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ObservApp.Web.Client/wwwroot
          cat > ObservApp.Web.Client/wwwroot/appsettings.Local.json <<'EOF'
          {
            "SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}",
            "SupabaseUrl": "${{ secrets.SUPABASE_URL }}",
            "SupabaseAnonKey": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::Faltan los secretos SUPABASE_URL y/o SUPABASE_ANON_KEY: el login no funcionará en la web publicada."
            exit 1
          fi

      - name: Restore Web Client
        run: dotnet restore ObservApp.Web.Client/ObservApp.Web.Client.csproj -p:TargetFramework=net10.0

      - name: Publish Blazor WASM standalone
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish ObservApp.Web.Client/ObservApp.Web.Client.csproj \
            --configuration Release \
            --output ./publish/web \
            --no-restore \
            -p:TargetFramework=net10.0 \
            -p:DefineConstants=STANDALONE_WASM \
            -p:DebuggerSupport=false \
            -p:CopyOutputSymbolsToPublishDirectory=false \
            -p:Version="$GITVERSION_FULLSEMVER" \
            -p:InformationalVersion="$GITVERSION_INFORMATIONALVERSION"

      - name: Reducir tamaño del publish
        shell: bash
        run: |
          set -euo pipefail
          cd publish/web/wwwroot

          # 1) Quita las versiones .gz (se mantienen las .br)
          find . -name '*.gz' -delete

          # 2) Syncfusion.Blazor.Themes publica TODOS los temas (~234 MB).
          #    La app solo usa material3-dark.css (index.html). El plan Free de
          #    Azure Static Web Apps limita la app a 250 MB, así que se eliminan
          #    el resto de temas.
          if [ -d _content/Syncfusion.Blazor.Themes ]; then
            find _content/Syncfusion.Blazor.Themes -type f \
              ! -name 'material3-dark.css' \
              ! -name 'material3-dark.css.br' \
              -delete
            find _content/Syncfusion.Blazor.Themes -type d -empty -delete
          fi

          echo "Tamaño final de wwwroot:"
          du -sh .

      - name: Resumen del publish
        shell: bash
        # Solo diagnóstico: nunca debe tumbar el despliegue.
        # (Con `pipefail`, `sort | head` devolvía exit 2 por SIGPIPE y abortaba el job.)
        continue-on-error: true
        run: |
          echo "index.html:"; find publish/web -name index.html
          echo "Por carpeta (top 15):"
          du -h --max-depth=2 publish/web/wwwroot | sort -rh | sed -n '1,15p' || true
          echo "Ficheros más grandes (top 15):"
          find publish/web/wwwroot -type f -printf '%s %p\n' | sort -rn | sed -n '1,15p' || true

      - name: Deploy to Azure Static Web Apps
        if: env.AZURE_STATIC_WEB_APPS_API_TOKEN != ''
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "publish/web/wwwroot"
          output_location: ""
          skip_app_build: true