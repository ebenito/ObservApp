name: Build ObservApp

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore Android
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-android

      - name: Restore Windows
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-windows10.0.26100.0 -p:RuntimeIdentifier=win-x64

      - name: Build Android
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release

      - name: Build Windows
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-restore

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ObservApp-Android
          path: ObservApp/bin/Release/net10.0-android/*.apk
          if-no-files-found: warn

      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ObservApp-Windows
          path: ObservApp/bin/Release/net10.0-windows10.0.26100.0/win-x64/**/*.msix
          if-no-files-found: warn
