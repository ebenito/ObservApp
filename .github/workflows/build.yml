name: Build ObservApp

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      build_android:
        description: "Ejecutar build/publicación Android"
        required: true
        type: boolean
        default: true
      build_windows:
        description: "Ejecutar build/publicación Windows"
        required: true
        type: boolean
        default: false
      build_web:
        description: "Ejecutar publish Web"
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: windows-latest
    env:
      ANDROID_HOME: 'C:\\ProgramData\\Android\\Sdk'
      ANDROID_SDK_ROOT: 'C:\\ProgramData\\Android\\Sdk'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Accept Android SDK licenses (if sdkmanager available)
        shell: pwsh
        run: |
          $sdkManagerPaths = @(
            "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager",
            "$env:ANDROID_SDK_ROOT\cmdline-tools\bin\sdkmanager",
            "$env:ANDROID_SDK_ROOT\tools\bin\sdkmanager",
            "C:\\ProgramData\\Android\\Sdk\\cmdline-tools\\latest\\bin\\sdkmanager"
          )
          $found = $false
          foreach ($p in $sdkManagerPaths) {
            if (Test-Path $p) {
              Write-Host "Using sdkmanager at: $p"
              echo y | & $p --licenses
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "sdkmanager not found on runner; skipping license acceptance."
          }

      - name: Install GitVersion
        shell: pwsh
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.3.0
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"

      - name: Calculate version with GitVersion
        id: gitversion
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          dotnet-gitversion /output json /nofetch | Out-File -FilePath gitversion.json -Encoding UTF8

          $json = Get-Content gitversion.json | ConvertFrom-Json
          $SEMVER = $json.SemVer
          $FULLSEMVER = $json.FullSemVer
          $INFOVERSION = $json.InformationalVersion

          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_SEMVER=$SEMVER"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_FULLSEMVER=$FULLSEMVER"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_INFORMATIONALVERSION=$INFOVERSION"
          # Directory.Build.props usa MAJOR/MINOR para ApplicationDisplayVersion (versión visible MSIX/APK)
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_MAJOR=$($json.Major)"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_MINOR=$($json.Minor)"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_MAJORMINORPATCH=$($json.MajorMinorPatch)"

      - name: Crear appsettings.Local.json para MAUI
        run: |
          echo '{"SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}"}' > ObservApp/appsettings.Local.json

      - name: Restore Android
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-android

      - name: Build Android
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release

      - name: Publish Android
        run: dotnet publish ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release --no-restore --output ObservApp/publish/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: ObservApp-Android
          path: ObservApp/publish/android/*.apk
          if-no-files-found: warn

  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install GitVersion
        run: dotnet tool install --global GitVersion.Tool --version 6.3.0

      - name: Calculate version with GitVersion
        id: gitversion
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          dotnet-gitversion /output json /nofetch | Out-File -FilePath gitversion.json -Encoding UTF8

          $json = Get-Content gitversion.json | ConvertFrom-Json
          $SEMVER = $json.SemVer
          $FULLSEMVER = $json.FullSemVer
          $INFOVERSION = $json.InformationalVersion

          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_SEMVER=$SEMVER"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_FULLSEMVER=$FULLSEMVER"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_INFORMATIONALVERSION=$INFOVERSION"
          # Directory.Build.props usa MAJOR/MINOR para ApplicationDisplayVersion (versión visible MSIX/APK)
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_MAJOR=$($json.Major)"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_MINOR=$($json.Minor)"
          Add-Content -Path $env:GITHUB_ENV -Value "GITVERSION_MAJORMINORPATCH=$($json.MajorMinorPatch)"

          Write-Host "GitVersion ejecutado correctamente" -ForegroundColor Green
          Write-Host "Versión: $FULLSEMVER" -ForegroundColor Cyan

      - name: Crear appsettings.Local.json para MAUI
        run: |
          echo '{"SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}"}' > ObservApp/appsettings.Local.json

      - name: Crear appsettings.Local.json para Web Host
        run: |
          echo '{
            "SupabaseUrl": "${{ secrets.SUPABASE_URL }}",
            "SupabaseAnonKey": "${{ secrets.SUPABASE_ANON_KEY }}"
          }' > ObservApp.Web/appsettings.Local.json

      # RuntimeIdentifierOverride (no RuntimeIdentifier): el csproj lo aplica solo al TFM
      # de Windows. Un RuntimeIdentifier global contamina el TFM Android de ObservApp.Shared
      # y el restore pide Microsoft.NETCore.App.Runtime.Mono.win-x64, que no existe (NU1102).
      - name: Restore Windows
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-windows10.0.26100.0 -p:RuntimeIdentifierOverride=win-x64

      # Sin --no-restore: el restore explicito corre en Debug y no descarga los runtime packs
      # win-x64 que exige Release (PublishReadyToRun=true) -> NETSDK1112. El restore
      # implicito aqui es seguro porque RuntimeIdentifierOverride no es un RID global.
      - name: Build Windows
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0 --configuration Release -p:RuntimeIdentifierOverride=win-x64

      # El MSIX no se genera en --output: lo escribe el empaquetador en AppxPackageDir.
      # Sin certificado en CI: paquete sin firmar (AppxPackageSigningEnabled=false) y sin
      # certificado temporal (GenerateTemporaryStoreCertificate=false evita MSB4044
      # "CertificateThumbprint" en WinAppSdkRemoveDisposableSigningCertificate).
      - name: Publish Windows
        run: >
          dotnet publish ObservApp/ObservApp.csproj
          --framework net10.0-windows10.0.26100.0
          --configuration Release
          --no-restore
          -p:RuntimeIdentifierOverride=win-x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:GenerateTemporaryStoreCertificate=false
          -p:AppxPackageDir=${{ github.workspace }}\ObservApp\publish\windows\
          --output ObservApp/publish/windows-bin

      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v5
        with:
          name: ObservApp-Windows
          # Solo el paquete de la app; se excluye Dependencies/*/Microsoft.WindowsAppRuntime*.msix (~125 MB)
          path: ObservApp/publish/windows/**/ObservApp_*.msix
          if-no-files-found: error

  build-web:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_web) || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion and jq
        shell: bash
        run: |
          dotnet tool install --global GitVersion.Tool --version 6.3.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Calculate version with GitVersion
        id: gitversion
        shell: bash
        run: |
          set -euo pipefail

          dotnet-gitversion /output json /nofetch > gitversion.json

          VERSION="$(jq -r '.SemVer' gitversion.json)"
          FULL_VERSION="$(jq -r '.FullSemVer' gitversion.json)"
          INFORMATIONAL_VERSION="$(jq -r '.InformationalVersion' gitversion.json)"

          {
            echo "GITVERSION_SEMVER=$VERSION"
            echo "GITVERSION_FULLSEMVER=$FULL_VERSION"
            echo "GITVERSION_INFORMATIONALVERSION=$INFORMATIONAL_VERSION"
            echo "GITVERSION_MAJOR=$(jq -r '.Major' gitversion.json)"
            echo "GITVERSION_MINOR=$(jq -r '.Minor' gitversion.json)"
          } >> "$GITHUB_ENV"

          echo "Version: $FULL_VERSION"

      - name: Crear appsettings.Local.json para Web Client
        shell: bash
        run: |
          cat > ObservApp.Web.Client/wwwroot/appsettings.Local.json <<'EOF'
          {
            "SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}",
            "SupabaseUrl": "${{ secrets.SUPABASE_URL }}",
            "SupabaseAnonKey": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Restore Web Client (net10.0)
        run: dotnet restore ObservApp.Web.Client/ObservApp.Web.Client.csproj -p:TargetFramework=net10.0

      - name: Publish Blazor WASM standalone
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish ObservApp.Web.Client/ObservApp.Web.Client.csproj \
            --configuration Release \
            --output ./publish/web \
            --no-restore \
            -p:TargetFramework=net10.0 \
            -p:DefineConstants=STANDALONE_WASM \
            -p:DebuggerSupport=false \
            -p:CopyOutputSymbolsToPublishDirectory=false \
            -p:Version="$GITVERSION_FULLSEMVER" \
            -p:InformationalVersion="$GITVERSION_INFORMATIONALVERSION"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v5
        with:
          name: ObservApp-Web
          path: publish/web
          if-no-files-found: warn

  # Despliega en Netlify el artefacto generado por build-web.
  # Requiere los secretos NETLIFY_AUTH_TOKEN (token personal de Netlify) y
  # NETLIFY_SITE_ID (ID del proyecto "observapp"). Si faltan, se omite el despliegue.
  deploy-netlify:
    if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' && secrets.NETLIFY_SITE_ID != '' }}
    needs: build-web
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      # Solo se necesita netlify.toml (redirecciones y cabeceras).
      - name: Checkout netlify.toml
        uses: actions/checkout@v5
        with:
          sparse-checkout: netlify.toml
          sparse-checkout-cone-mode: false

      - name: Download Web artifact
        uses: actions/download-artifact@v5
        with:
          name: ObservApp-Web
          path: publish/web

      - name: Reducir tamaño del publish
        shell: bash
        run: |
          set -euo pipefail
          cd publish/web/wwwroot

          # Netlify comprime en el CDN: sobran las versiones precomprimidas.
          find . \( -name '*.gz' -o -name '*.br' \) -delete

          # La app solo usa el tema material3-dark de Syncfusion (index.html).
          if [ -d _content/Syncfusion.Blazor.Themes ]; then
            find _content/Syncfusion.Blazor.Themes -type f ! -name 'material3-dark.css' -delete
            find _content/Syncfusion.Blazor.Themes -type d -empty -delete
          fi

          # Configuración exclusiva de Azure Static Web Apps.
          rm -f staticwebapp.config.json

          du -sh .

      - name: Deploy to Netlify
        shell: bash
        run: |
          set -euo pipefail
          npx --yes netlify-cli@latest deploy \
            --prod \
            --dir publish/web/wwwroot \
            --no-build \
            --message "GitHub Actions ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"