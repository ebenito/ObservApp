name: Build ObservApp

on:
  push:
    branches: [ "develop", "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      build_android:
        description: "Ejecutar build/publicación Android"
        required: true
        type: boolean
        default: true
      build_windows:
        description: "Ejecutar build/publicación Windows"
        required: true
        type: boolean
        default: false
      build_web:
        description: "Ejecutar publish Web"
        required: true
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: windows-latest
    env:
      ANDROID_HOME: 'C:\\ProgramData\\Android\\Sdk'
      ANDROID_SDK_ROOT: 'C:\\ProgramData\\Android\\Sdk'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Accept Android SDK licenses (if sdkmanager available)
        shell: pwsh
        run: |
          $sdkManagerPaths = @(
            "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager",
            "$env:ANDROID_SDK_ROOT\cmdline-tools\bin\sdkmanager",
            "$env:ANDROID_SDK_ROOT\tools\bin\sdkmanager",
            "C:\\ProgramData\\Android\\Sdk\\cmdline-tools\\latest\\bin\\sdkmanager"
          )
          $found = $false
          foreach ($p in $sdkManagerPaths) {
            if (Test-Path $p) {
              Write-Host "Using sdkmanager at: $p"
              echo y | & $p --licenses
              $found = $true
              break
            }
          }
          if (-not $found) {
            Write-Host "sdkmanager not found on runner; skipping license acceptance."
          }

      - name: Install GitVersion tool
        run: dotnet tool install -g GitVersion.Tool

      - name: Calculate version with GitVersion
        id: gitversion
        run: |
          dotnet-gitversion /output buildserver /nofetch
          Write-Host "GitVersion ejecutado correctamente" -ForegroundColor Green
          Write-Host "Variables disponibles en env:" -ForegroundColor Cyan
          Get-ChildItem env: | Where-Object { $_.Name -like "GITVERSION*" } | ForEach-Object {
            Write-Host "  $($_.Name): $($_.Value)" -ForegroundColor Gray
          }
        shell: pwsh

      - name: Crear appsettings.Local.json para MAUI
        run: |
          echo '{"SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}"}' > ObservApp/appsettings.Local.json

      - name: Restore Android
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-android

      - name: Build Android
        continue-on-error: true
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release

      - name: Publish Android
        continue-on-error: true
        run: dotnet publish ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release --no-restore --output ObservApp/publish/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: ObservApp-Android
          path: ObservApp/publish/android/*.apk
          if-no-files-found: warn

  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Install GitVersion tool
        run: dotnet tool install -g GitVersion.Tool

      - name: Calculate version with GitVersion
        id: gitversion
        run: |
          dotnet-gitversion /output buildserver /nofetch
          Write-Host "GitVersion ejecutado correctamente" -ForegroundColor Green
          Write-Host "Variables disponibles en env:" -ForegroundColor Cyan
          Get-ChildItem env: | Where-Object { $_.Name -like "GITVERSION*" } | ForEach-Object {
            Write-Host "  $($_.Name): $($_.Value)" -ForegroundColor Gray
          }
        shell: pwsh

      - name: Crear appsettings.Local.json para MAUI
        run: |
          echo '{"SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}"}' > ObservApp/appsettings.Local.json

      - name: Crear appsettings.Local.json para Web Host
        run: |
          echo '{
            "SupabaseUrl": "${{ secrets.SUPABASE_URL }}",
            "SupabaseAnonKey": "${{ secrets.SUPABASE_ANON_KEY }}"
          }' > ObservApp.Web/appsettings.Local.json

      - name: Restore Windows
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-windows10.0.26100.0 -p:RuntimeIdentifier=win-x64

      - name: Build Windows
        continue-on-error: true
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0 --configuration Release -p:RuntimeIdentifier=win-x64

      - name: Publish Windows
        continue-on-error: true
        run: dotnet publish ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0 --configuration Release -p:RuntimeIdentifier=win-x64 --output ObservApp/publish/windows

      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v5
        with:
          name: ObservApp-Windows
          path: ObservApp/publish/windows/*.msix
          if-no-files-found: warn

  build-web:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_web) || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install GitVersion tool
        run: dotnet tool install -g GitVersion.Tool

      - name: Calculate version with GitVersion
        id: gitversion
        run: dotnet-gitversion /output buildserver /nofetch

      - name: Crear appsettings.Local.json para Web Client
        run: |
          echo '{"SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}"}' \
            > ObservApp.Web.Client/wwwroot/appsettings.Local.json

      - name: Restore Web Client (solo net10.0)
        run: dotnet restore ObservApp.Web.Client/ObservApp.Web.Client.csproj -p:TargetFramework=net10.0

      - name: Publish Blazor WASM standalone
        continue-on-error: true
        run: |
          VER="${GITVERSION_FULLSEMVER:-1.0.0}"
          INFOVERS="${GITVERSION_INFORMATIONALVERSION:-1.0.0}"
          dotnet publish ObservApp.Web.Client/ObservApp.Web.Client.csproj \
            --configuration Release \
            --output ./publish/web \
            --no-restore \
            -p:TargetFramework=net10.0 \
            -p:DefineConstants=STANDALONE_WASM \
            -p:DebuggerSupport=false \
            -p:CopyOutputSymbolsToPublishDirectory=false \
            -p:Version="$VER" \
            -p:InformationalVersion="$INFOVERS"

      - name: Upload Web artifact
        uses: actions/upload-artifact@v5
        with:
          name: ObservApp-Web
          path: publish/web
          if-no-files-found: warn
