on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    env:
      SYNCFUSION_LICENSE_KEY: ${{ secrets.SYNCFUSION_LICENSE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Restore Android
        run: dotnet restore ObservApp/ObservApp.csproj --framework net10.0-android

      - name: Restore Windows
        run: dotnet restore ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0

      - name: Build Android
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release --no-restore

      - name: Build Windows
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-restore
        run: dotnet restore ObservApp/ObservApp.csproj -f net10.0-windows10.0.26100.0

      - name: Build Android
        run: dotnet build ObservApp/ObservApp.csproj -f net10.0-android --configuration Release --no-restore

      - name: Build Windows
        run: dotnet build ObservApp/ObservApp.csproj -f net10.0-windows10.0.26100.0 --configuration Release --no-restore
