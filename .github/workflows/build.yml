name: Build ObservApp

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: Crear appsettings.Local.json
        run: |
          echo '{"SyncfusionLicenseKey": "${{ secrets.SYNCFUSION_LICENSE_KEY }}"}' > ObservApp/appsettings.Local.json

      - name: Restore Android
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-android

      - name: Restore Windows
        run: dotnet restore ObservApp/ObservApp.csproj -p:TargetFramework=net10.0-windows10.0.26100.0 -p:RuntimeIdentifier=win-x64

      - name: Build Android
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release

      - name: Publish Android
        run: dotnet publish ObservApp/ObservApp.csproj --framework net10.0-android --configuration Release --no-restore --output ObservApp/publish/android

      - name: Build Windows
        run: dotnet build ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-restore

      - name: Publish Windows
        run: dotnet publish ObservApp/ObservApp.csproj --framework net10.0-windows10.0.26100.0 --configuration Release --no-restore --output ObservApp/publish/windows

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ObservApp-Android
          path: ObservApp/publish/android/*.apk
          if-no-files-found: warn

      - name: Upload Windows MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ObservApp-Windows
          path: ObservApp/publish/windows/*.msix
          if-no-files-found: warn

  deploy-web:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Restore con TFM explícito para que MSBuild no intente
      # restaurar net10.0-android (workload no disponible en ubuntu-latest)
      - name: Restore Web Client
        run: dotnet restore ObservApp.Web.Client/ObservApp.Web.Client.csproj -p:TargetFramework=net10.0

      - name: Publish Blazor WASM
        run: dotnet publish ObservApp.Web.Client/ObservApp.Web.Client.csproj --configuration Release --output ./publish/web --no-restore

      # Diagnóstico: muestra la estructura real del output para verificar rutas
      - name: Mostrar estructura del publish
        run: find ./publish/web -type f | sort

      - name: Copiar staticwebapp.config.json
        run: cp ObservApp.Web.Client/wwwroot/staticwebapp.config.json ./publish/web/wwwroot/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ./publish/web/wwwroot
          skip_app_build: true
          output_location: ""
