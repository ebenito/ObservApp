<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                                   user-scalable=no, viewport-fit=cover" />
    <title>ObservApp</title>
    <base href="/" />

    <!-- Syncfusion Material Dark theme -->
    <link href="_content/Syncfusion.Blazor.Themes/material3-dark.css" rel="stylesheet" />

    <!-- App styles -->
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="ObservApp.styles.css" />

    <link rel="icon" href="data:,">

    <!-- Syncfusion scripts -->
    <script src="_content/Syncfusion.Blazor.Core/scripts/syncfusion-blazor.min.js"
            type="text/javascript"></script>
</head>

<body>
    <div class="status-bar-safe-area"></div>
    <div id="app">
        <div class="app-loading">
            <div class="loading-spinner"></div>
            <p id="loading-text">Cargando ObservApp…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error no controlado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Textos localizados del spinner + función applyLang (sincronizados con los .resx) -->
    <script src="_content/ObservApp.Shared/loading-texts.js"></script>

    <!-- Aplica el idioma al spinner ANTES de que arranque Blazor -->
    <script>
        (function () {
            var TEXTS = window.ObservApp.LOADING_TEXTS;

            // 1. Preferencia guardada; si no existe, idioma del sistema
            var lang;
            try { lang = localStorage.getItem("app_language"); } catch (e) { }
            if (!lang) {
                lang = (navigator.language || navigator.userLanguage || "es")
                    .substring(0, 2).toLowerCase();
            }
            if (!TEXTS[lang]) lang = "es";

            // 2. Texto del spinner desde los .resx
            var el = document.getElementById("loading-text");
            if (el) el.textContent = TEXTS[lang];

            // 3. lang y dir del <html>
            document.documentElement.lang = lang;
            document.documentElement.dir  = lang === "ar" ? "rtl" : "ltr";
        })();
    </script>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/ObservApp.Shared/geolocation.js"></script>
</body>
</html>
